[package]
name = "opensearch-parquet-format"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
workspace = "../../../../../libs/dataformat-native/rust"

[features]
test-utils = []

[lib]
name = "opensearch_parquet_format"
crate-type = ["rlib"]

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
arrow-ipc = { workspace = true }
lazy_static = { workspace = true }
dashmap = { workspace = true }
tempfile = { workspace = true }
native-bridge-common = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
crc32fast = { workspace = true }
serde_json = { workspace = true }
liquid-cache = { workspace = true }
t4 = { workspace = true }
# DataFusion-backed doc-values decode path (parquet.docvalues.decode_path=datafusion).
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
opensearch-parquet-format = { path = ".", features = ["test-utils"] }


[[bench]]
name = "merge_projection_bench"
harness = false
